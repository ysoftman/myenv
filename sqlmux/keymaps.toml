# The WHERE input in NORMAL
[keys.wherenormal]
# "<CR>" = "where.run"  # Run
# "/" = "where.history"  # History / favorites
# "<Esc>" = "where.leave"  # Back to the grid

# Records marked, or VISUAL on a table: over grid / result; its keys are complete, no timeoutlen to wait
[keys.select]
