# "<C-u>" = "keyhelp.scroll.up"  # Scroll up

# While a cell is edited
[keys.cell]
# "<CR>" = "cell.accept"  # Accept this cell
# "<Esc>" = "cell.done"  # End editing

# In any input
[keys.input]
# "<C-r>" = "where.history"  # History / favorites
